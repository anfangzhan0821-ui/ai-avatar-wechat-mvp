services:
  - type: web
    name: ai-avatar-wechat-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_API_STYLE
        value: chat_completions
      - key: AI_TIMEOUT_MS
        value: "25000"
      - key: MAX_REPLY_CHARS
        value: "120"
      - key: KNOWLEDGE_MAX_CHARS
        value: "32000"
      - key: HUMAN_HANDOFF_KEYWORDS
        value: 付款,合同,退款,投诉,能便宜吗,转人工,本人,老板
      - key: WECHAT_TOKEN
        sync: false
      - key: WECHAT_CORP_ID
        sync: false
      - key: WECHAT_ENCODING_AES_KEY
        sync: false
      - key: WECHAT_AGENT_ID
        sync: false
      - key: WECHAT_CORP_SECRET
        sync: false
      - key: WECHAT_KF_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AVATAR_SYSTEM_PROMPT
        sync: false
